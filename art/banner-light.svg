<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 800 200"><title id="title">Helios Lightfield</title><desc id="desc">An animated abstract light sculpture. No ads, tracking, or analytics.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs><rect width="800" height="200" fill="#fff" stroke="#e5e7eb" rx="16"/><text x="42" y="82" fill="#0f172a" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Helios Lightfield</text><text x="44" y="110" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">Animated light sculpture for Android TV</text><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle"><rect width="64" height="22" x="44" y="128" fill="#fff7ed" stroke="#f59e0b" stroke-width=".8" rx="11"/><text x="76" y="143" fill="#f59e0b">No ads</text><rect width="90" height="22" x="116" y="128" fill="#fff7ed" stroke="#60a5fa" stroke-width=".8" rx="11"/><text x="161" y="143" fill="#60a5fa">No tracking</text><rect width="100" height="22" x="214" y="128" fill="#fff7ed" stroke="#4ade80" stroke-width=".8" rx="11"/><text x="264" y="143" fill="#4ade80">No analytics</text></g><g fill="none" stroke-width="2" transform="translate(660 98)"><ellipse stroke="#f59e0b" rx="92" ry="47" transform="rotate(-19)"/><ellipse stroke="#fb923c" rx="76" ry="39" transform="rotate(23)"/><ellipse stroke="#fde68a" rx="60" ry="30" transform="rotate(-37)"/><circle r="4" fill="#fff5d9" stroke="none"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Helios Lightfield</title><desc id="desc">An animated abstract light sculpture. No ads, tracking, or analytics.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient></defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <text x="42" y="82" fill="#fff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Helios Lightfield</text>
  <text x="44" y="110" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">Animated light sculpture for Android TV</text>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle">
    <rect x="44" y="128" width="64" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8"/><text x="76" y="143" fill="#fbbf24">No ads</text>
    <rect x="116" y="128" width="90" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8"/><text x="161" y="143" fill="#60a5fa">No tracking</text>
    <rect x="214" y="128" width="100" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8"/><text x="264" y="143" fill="#4ade80">No analytics</text>
  </g>
  <g transform="translate(660 98)" fill="none" stroke-width="2">
    <ellipse rx="92" ry="47" stroke="#fbbf24" transform="rotate(-19)"/><ellipse rx="76" ry="39" stroke="#fb923c" transform="rotate(23)"/><ellipse rx="60" ry="30" stroke="#fde68a" transform="rotate(-37)"/><circle r="4" fill="#fff5d9" stroke="none"/>
  </g>
</svg>